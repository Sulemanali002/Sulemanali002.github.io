<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography — Suleman Ali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F8F9; --card: #FFFFFF; --line: #E7ECEE; --ink: #12232D; --muted: #6C7C85;
    --shadow: 0 1px 2px rgba(18,35,45,0.04), 0 10px 24px rgba(18,35,45,0.06);
    --shadow-hover: 0 4px 10px rgba(18,35,45,0.06), 0 18px 34px rgba(18,35,45,0.1);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg);
    background-image: radial-gradient(560px 320px at 50% -80px, #E4F3F9 0%, rgba(228,243,249,0) 70%);
    background-repeat: no-repeat;
    color: var(--ink); font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
  }
  .wrap{ max-width: 560px; margin: 0 auto; padding: 40px 22px 60px; }
  .back{ display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); text-decoration: none; margin-bottom: 22px; }
  .back svg{ width: 15px; height: 15px; }
  h1{ font-family: 'Fraunces', serif; font-weight: 550; font-size: 30px; margin: 0 0 6px; }
  .subtitle{ color: var(--muted); font-size: 14.5px; margin: 0 0 26px; }
  .grid{ display: flex; flex-wrap: wrap; gap: 12px; }
  .photo-card{
    flex: 1 1 calc(33.333% - 8px); min-width: 100px;
    border-radius: 14px; overflow: hidden; background: var(--card);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    cursor: pointer; transition: transform .18s ease, box-shadow .18s ease;
  }
  .photo-card:hover{ transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .photo-card img{ width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
  .empty{ text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; width: 100%; background: var(--card); border-radius: 16px; border: 1px solid var(--line); }
  .empty.error{ color: #B3261E; text-align: left; font-size: 13px; line-height: 1.6; }
  .lightbox{
    display: none; position: fixed; inset: 0; background: rgba(15,23,28,0.92);
    z-index: 100; align-items: center; justify-content: center; padding: 24px; flex-direction: column;
  }
  .lightbox.open{ display: flex; }
  .lightbox img{ max-width: 100%; max-height: 80vh; border-radius: 10px; }
  .lightbox .caption{ color: #fff; margin-top: 14px; font-size: 14px; }
  .lightbox .close{ position: absolute; top: 20px; right: 24px; color: #fff; font-size: 28px; background: none; border: none; cursor: pointer; line-height: 1; }
  footer{ text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Back to portfolio
  </a>

  <h1>Photography</h1>
  <p class="subtitle" id="subtitle">Loading…</p>

  <div class="grid" id="grid"></div>

  <footer>© 2026 Suleman Ali — Skardu, Gilgit-Baltistan, Pakistan</footer>
</div>

<div class="lightbox" id="lightbox">
  <button class="close" id="lightboxClose">&times;</button>
  <img id="lightboxImg" src="" alt="">
  <p class="caption" id="lightboxCaption"></p>
</div>

<script>
  // Auto-lists every image inside the "images/photography" folder of this repo.
  // To add photos: just upload files into that folder on GitHub — nothing else needed.
  const REPO = 'Sulemanali002/Sulemanali002.github.io';
  const FOLDER = 'images/photography';

  function titleFromFilename(name){
    return name
      .replace(/\.[^/.]+$/, '')         // remove extension
      .replace(/[-_]+/g, ' ')           // dashes/underscores -> spaces
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/\b\w/g, c => c.toUpperCase()); // Title Case
  }

  fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`)
    .then(r => {
      if (r.status === 404) throw new Error('FOLDER_NOT_FOUND');
      if (!r.ok) throw new Error('HTTP_' + r.status);
      return r.json();
    })
    .then(files => {
      const images = files
        .filter(f => /\.(jpe?g|png|webp|gif)$/i.test(f.name))
        .sort((a, b) => a.name.localeCompare(b.name));

      document.getElementById('subtitle').textContent =
        images.length ? images.length + ' photos' : 'No photos yet — check back soon.';

      const grid = document.getElementById('grid');
      if (images.length === 0) {
        grid.innerHTML = '<p class="empty">No photos uploaded yet. Add images to the images/photography folder on GitHub.</p>';
        return;
      }

      grid.innerHTML = '';
      images.forEach(f => {
        const title = titleFromFilename(f.name);
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `<img src="${f.download_url}" alt="${title}" loading="lazy">`;
        card.onclick = () => openLightbox(f.download_url, title);
        grid.appendChild(card);
      });
    })
    .catch(err => {
      document.getElementById('subtitle').textContent = 'Could not load photos.';
      let msg = 'Something went wrong loading photos (' + err.message + '). Please try again shortly.';
      if (err.message === 'FOLDER_NOT_FOUND') {
        msg = 'The images/photography folder does not exist yet in the repo, or the repo is private. Create the folder and upload photos, and make sure the repo is set to Public in GitHub settings.';
      }
      document.getElementById('grid').innerHTML =
        `<div class="empty error"><strong>Error:</strong> ${msg}</div>`;
    });

  function openLightbox(url, title){
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightboxCaption').textContent = title;
    document.getElementById('lightbox').classList.add('open');
  }
  document.getElementById('lightboxClose').onclick = () =>
    document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox').onclick = (e) => {
    if (e.target.id === 'lightbox') e.target.classList.remove('open');
  };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates — Suleman Ali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F8F9; --card: #FFFFFF; --line: #E7ECEE; --ink: #12232D; --muted: #6C7C85; --ice: #2F9BCB;
    --shadow: 0 1px 2px rgba(18,35,45,0.04), 0 10px 24px rgba(18,35,45,0.06);
    --shadow-hover: 0 4px 10px rgba(18,35,45,0.06), 0 18px 34px rgba(18,35,45,0.1);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg);
    background-image: radial-gradient(560px 320px at 50% -80px, #E4F3F9 0%, rgba(228,243,249,0) 70%);
    background-repeat: no-repeat;
    color: var(--ink); font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.55;
  }
  .wrap{ max-width: 520px; margin: 0 auto; padding: 40px 22px 60px; }
  .back{ display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); text-decoration: none; margin-bottom: 22px; }
  .back svg{ width: 15px; height: 15px; }
  h1{ font-family: 'Fraunces', serif; font-weight: 550; font-size: 30px; margin: 0 0 6px; }
  .subtitle{ color: var(--muted); font-size: 14.5px; margin: 0 0 26px; }
  .cert-row{
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 13px 16px; margin-bottom: 9px; color: var(--ink); box-shadow: var(--shadow);
    text-decoration: none; transition: transform .16s ease, box-shadow .16s ease;
  }
  .cert-row:hover{ transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .cert-icon{ width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
  .cert-icon svg{ width: 18px; height: 18px; }
  .cert-text{ flex: 1; min-width: 0; }
  .cert-text .title{ font-size: 14px; font-weight: 600; margin: 0; }
  .chev{ color: #C4CDD1; flex-shrink: 0; }
  .chev svg{ width: 16px; height: 16px; }
  .empty{ text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; background: var(--card); border-radius: 16px; border: 1px solid var(--line); }
  .empty.error{ color: #B3261E; text-align: left; font-size: 13px; line-height: 1.6; }
  footer{ text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Back to portfolio
  </a>

  <h1>Certificates</h1>
  <p class="subtitle" id="subtitle">Loading…</p>

  <div id="cert-list"></div>

  <footer>© 2026 Suleman Ali — Skardu, Gilgit-Baltistan, Pakistan</footer>
</div>

<script>
  // Auto-lists every file inside the "certificates" folder of this repo.
  // To add a certificate: just upload the PDF/image into that folder on GitHub —
  // its display name is taken directly from the filename.
  const REPO = 'Sulemanali002/Sulemanali002.github.io';
  const FOLDER = 'certificates';

  function titleFromFilename(name){
    return name
      .replace(/\.[^/.]+$/, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  const pdfIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

  fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`)
    .then(r => {
      if (r.status === 404) throw new Error('FOLDER_NOT_FOUND');
      if (!r.ok) throw new Error('HTTP_' + r.status);
      return r.json();
    })
    .then(files => {
      const certs = files
        .filter(f => /\.(pdf|jpe?g|png)$/i.test(f.name))
        .sort((a, b) => a.name.localeCompare(b.name));

      document.getElementById('subtitle').textContent =
        certs.length ? certs.length + ' certificates' : 'No certificates yet.';

      const list = document.getElementById('cert-list');
      if (certs.length === 0) {
        list.innerHTML = '<p class="empty">No certificates uploaded yet. Add files to the certificates folder on GitHub.</p>';
        return;
      }

      list.innerHTML = certs.map(f => `
        <a class="cert-row" href="${f.download_url}" target="_blank" rel="noopener">
          <div class="cert-icon" style="background:#2F9BCB;">${pdfIcon}</div>
          <div class="cert-text"><p class="title">${titleFromFilename(f.name)}</p></div>
          <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>`).join('');
    })
    .catch(err => {
      document.getElementById('subtitle').textContent = 'Could not load certificates.';
      let msg = 'Something went wrong loading certificates (' + err.message + '). Please try again shortly.';
      if (err.message === 'FOLDER_NOT_FOUND') {
        msg = 'The certificates folder does not exist yet, or the repo is private. Create the folder, upload your files, and make sure the repo is set to Public in GitHub settings.';
      }
      document.getElementById('cert-list').innerHTML =
        `<div class="empty error"><strong>Error:</strong> ${msg}</div>`;
    });
</script>
</body>
</html>
